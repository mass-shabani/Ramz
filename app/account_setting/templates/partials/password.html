<ramz-card title="Password" subtitle="Change your account password">
  <div slot="icon" class="card-icon icon-soft--rose">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="3"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
  </div>

  {% if not permissions.password %}
  <p style="color: var(--muted); font-size: 13px; margin: 0;">
    You do not have permission to change your password.
  </p>
  {% else %}
  <form method="post" action="/account/settings/password" data-ajax="true">
    <input type="hidden" name="section" value="password" />
    <div class="settings-rows">

      <div class="settings-row">
        <div class="settings-row-label">
          <div class="label">Current Password</div>
          <div class="hint">Confirm your current password</div>
        </div>
        <div class="settings-row-control">
          <div class="settings-field">
            <input type="password" name="current_password"
                   placeholder="••••••••" required />
          </div>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-row-label">
          <div class="label">New Password</div>
          <div class="hint">At least 8 characters</div>
        </div>
        <div class="settings-row-control">
          <div class="settings-field">
            <input type="password" name="new_password"
                   placeholder="••••••••" minlength="8" required />
          </div>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-row-label">
          <div class="label">Confirm Password</div>
          <div class="hint">Repeat the new password</div>
        </div>
        <div class="settings-row-control">
          <div class="settings-field">
            <input type="password" name="confirm_password"
                   placeholder="••••••••" minlength="8" required />
          </div>
        </div>
      </div>

    </div>

    <div class="settings-actions">
      <button type="button" class="btn-ghost" data-action="cancel" disabled>Cancel</button>
      <button class="btn-primary" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        Update Password
      </button>
    </div>
  </form>
  {% endif %}
</ramz-card>
