{% extends "base.html" %}

{% block title %}ورود به سیستم - Crypto Services{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">ورود به حساب کاربری</h2>
                <p class="auth-subtitle">برای دسترسی به پنل مدیریت وارد شوید</p>
            </div>

            {% if error %}
            <div class="alert alert-error alert-auto-hide">
                <span class="alert-icon">⚠️</span>
                <span class="alert-text">{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">نام کاربری</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        required 
                        autocomplete="username"
                        placeholder="نام کاربری خود را وارد کنید"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">رمز عبور</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        required 
                        autocomplete="current-password"
                        placeholder="رمز عبور خود را وارد کنید"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-icon">🔐</span>
                    <span>ورود به سیستم</span>
                </button>
            </form>

            <div class="auth-footer">
                <p class="auth-text">حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block head_extra %}
<style>
.auth-section {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
}

.auth-container {
    width: 100%;
    max-width: 420px;
    padding: 0 1.5rem;
}

.auth-card {
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 2.5rem;
    box-shadow: var(--shadow-lg);
    animation: fadeInUp 0.6s ease;
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-title {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
}

.auth-subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-label {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-primary);
}

.form-input {
    background: var(--primary-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 0.875rem 1rem;
    color: var(--text-primary);
    font-size: 1rem;
    transition: all 0.2s ease;
}

.form-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
}

.form-input::placeholder {
    color: var(--text-muted);
}

.btn-block {
    width: 100%;
    margin-top: 0.5rem;
}

.auth-footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
}

.auth-text {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.auth-text a {
    color: var(--accent);
    font-weight: 500;
}

.auth-text a:hover {
    text-decoration: underline;
}

.alert {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
    border-radius: var(--border-radius);
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
}

.alert-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
{% endblock %}
