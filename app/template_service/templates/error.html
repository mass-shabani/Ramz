{% extends "base.html" %}

{% block title %}{{ status_code }} - {{ error_title }}{% endblock %}

{% block body_class %}page-error{% endblock %}

{% block content %}
<div class="error-wrap">

  <!-- Brand -->
  <a href="{{ home_url }}" class="error-brand">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 7v10l9 5 9-5V7z"/>
        <path d="M12 22V12"/>
        <path d="m3 7 9 5 9-5"/>
      </svg>
    </span>
    <span class="brand-name">Ramz</span>
  </a>

  <!-- Big code -->
  <div class="error-code">{{ status_code }}</div>

  <!-- Message -->
  <h1 class="error-title">{{ error_title }}</h1>
  <p class="error-text">
    {{ error_message }}
  </p>

  <!-- Actions -->
  <div class="error-actions">
    <a href="{{ home_url }}" class="error-btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 11 9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      Back to Home
    </a>
  </div>

  <!-- Small footer -->
  <div class="error-foot">Error Code · {{ status_code }}</div>

</div>
{% endblock %}
